spring.application.name=redis-java
server.port=8080
redis.tcp.port=6380

# Persistence mode: aof | snapshot | none
redis.persistence.mode=aof

# AOF settings (used when redis.persistence.mode=aof)
redis.aof.path=data/appendonly.aof
# Fsync policy: always | everysec | no
redis.aof.fsync=everysec

# Snapshot settings (used when redis.persistence.mode=snapshot)
redis.snapshot.path=data/dump.snapshot
redis.snapshot.interval-ms=300000

# Eviction: noeviction (default, matches real Redis) | allkeys-lru | allkeys-lfu
redis.maxmemory-policy=noeviction
# max-keys is a key-count proxy for real memory accounting (documented limitation).
# 0 = unlimited.
redis.max-keys=0
